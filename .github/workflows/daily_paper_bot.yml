name: Daily Paper Bot
on:
  schedule:
    # RPD 할당량 리셋(태평양시간 자정=UTC 08:00) 직후 실행 → 한국시간 오후 5시 20분
    - cron: '20 8 * * *'
  workflow_dispatch: # Actions 탭에서 수동 시작 허용

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai notion-client

      - name: Run Paper Bot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_new.py
        
      - name: Commit evaluated_papers.txt history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add evaluated_papers.txt 2>/dev/null || true
          if ! git diff --staged --quiet 2>/dev/null; then
            git commit -m "Update evaluated papers history [skip ci]"
            git push
            echo "✅ 변경사항을 커밋하고 push 했습니다."
          else
            echo "ℹ️ 커밋할 변경사항이 없습니다. 건너뜁니다."
          fi
