name: Daily Paper Bot
on:
  push:
    branches:
      - main
  schedule:
    # 한국시간 아침 9시 20분 (00:20 UTC) - 부하 분산을 위해 20분으로 조정
    - cron: '20 0 * * *'
  workflow_dispatch: # Actions 탭에서 수동 시작 허용

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-genai notion-client

      - name: Run Paper Bot
        env:
          # 환경변수로 시크릿 키들을 봇 파일에 전달합니다
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot_new.py
        
      - name: Commit evaluated_papers.txt history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add evaluated_papers.txt
          git commit -m "Update evaluated papers history [skip ci]" || echo "No changes to commit"
          git push
